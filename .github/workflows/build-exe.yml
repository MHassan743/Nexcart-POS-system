name: Auto Build & Release Nexcart POS Windows Executable Setup (.exe)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Build Standalone Windows .exe Installer Setup
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexcart-POS-Setup-v1.0
          path: release/*.exe
